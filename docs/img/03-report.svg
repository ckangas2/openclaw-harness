<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Report anatomy: composition up front, points with evidence, gaps, and an audit view"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6B7280"/></marker></defs><rect x="0" y="0" width="1600" height="900" rx="0" fill="#FBFAF8" stroke="#FBFAF8" stroke-width="0"/><text x="72" y="92" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="46" font-weight="650" fill="#1A1A1A" text-anchor="start" letter-spacing="0">What comes back</text><text x="72" y="134" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="22" font-weight="400" fill="#6B7280" text-anchor="start" letter-spacing="0">A report that opens by describing its own evidence, so you know what you are holding before you read a word of it.</text><line x1="72" y1="162" x2="1528" y2="162" stroke="#D8D4CE" stroke-width="2"/><rect x="72" y="212" width="740" height="596" rx="10" fill="#FFFFFF" stroke="#D8D4CE" stroke-width="1.5"/><text x="100" y="260" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="24" font-weight="650" fill="#1A1A1A" text-anchor="start" letter-spacing="0">What this report is built on</text><text x="100" y="326" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="21" font-weight="600" fill="#1D4ED8" text-anchor="start" letter-spacing="0">13 papers</text><text x="372" y="326" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="400" fill="#6B7280" text-anchor="start" letter-spacing="0">7 primary studies, 6 reviews</text><line x1="100" y1="344" x2="784" y2="344" stroke="#D8D4CE" stroke-width="1"/><text x="100" y="384" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="21" font-weight="600" fill="#1D4ED8" text-anchor="start" letter-spacing="0">2 of 13</text><text x="372" y="384" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="400" fill="#6B7280" text-anchor="start" letter-spacing="0">read as full text; 11 as abstract only</text><line x1="100" y1="402" x2="784" y2="402" stroke="#D8D4CE" stroke-width="1"/><text x="100" y="442" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="21" font-weight="600" fill="#1D4ED8" text-anchor="start" letter-spacing="0">0 of 30 points</text><text x="372" y="442" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="400" fill="#6B7280" text-anchor="start" letter-spacing="0">corroborated by two independent groups</text><line x1="100" y1="460" x2="784" y2="460" stroke="#D8D4CE" stroke-width="1"/><text x="100" y="500" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="21" font-weight="600" fill="#1D4ED8" text-anchor="start" letter-spacing="0">2 of 2</text><text x="372" y="500" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="400" fill="#6B7280" text-anchor="start" letter-spacing="0">key papers for this question, cited</text><line x1="100" y1="518" x2="784" y2="518" stroke="#D8D4CE" stroke-width="1"/><text x="100" y="558" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="21" font-weight="600" fill="#1D4ED8" text-anchor="start" letter-spacing="0">1 premise</text><text x="372" y="558" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="400" fill="#6B7280" text-anchor="start" letter-spacing="0">checked: the named trial exists</text><line x1="100" y1="576" x2="784" y2="576" stroke="#D8D4CE" stroke-width="1"/><text x="100" y="628" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="21" font-weight="600" fill="#1A1A1A" text-anchor="start" letter-spacing="0">Then: a point, and the evidence under it</text><rect x="100" y="650" width="684" height="150" rx="10" fill="#FBFAF8" stroke="#D8D4CE" stroke-width="1.5"/><text x="122" y="686" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="400" fill="#1A1A1A" text-anchor="start" letter-spacing="0">Neutralising antibody and hepatic sequestration limit</text><text x="122" y="714" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="400" fill="#1A1A1A" text-anchor="start" letter-spacing="0">systemic delivery in patients.   [E12] [E31] [E44]</text><text x="122" y="756" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="400" fill="#6B7280" text-anchor="start" letter-spacing="0">E12  Streby 2019, Results &gt; Viremia:  “Two patients had</text><text x="122" y="778" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="400" fill="#6B7280" text-anchor="start" letter-spacing="0">      detectable virus in day-7 tumour biopsies…”</text><rect x="848" y="212" width="680" height="288" rx="10" fill="#FFFFFF" stroke="#D8D4CE" stroke-width="1.5"/><text x="876" y="260" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="24" font-weight="650" fill="#1A1A1A" text-anchor="start" letter-spacing="0">And what is not known</text><text x="876" y="304" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20" font-weight="600" fill="#B45309" text-anchor="start" letter-spacing="0">•</text><text x="898" y="304" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="400" fill="#1A1A1A" text-anchor="start" letter-spacing="0">No independent comparison is cited in this section.</text><text x="876" y="346" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20" font-weight="600" fill="#B45309" text-anchor="start" letter-spacing="0">•</text><text x="898" y="346" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="400" fill="#1A1A1A" text-anchor="start" letter-spacing="0">Four of six points rest only on review articles.</text><text x="876" y="388" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20" font-weight="600" fill="#B45309" text-anchor="start" letter-spacing="0">•</text><text x="898" y="388" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="400" fill="#1A1A1A" text-anchor="start" letter-spacing="0">The evidence does not cover paediatric dosing.</text><text x="876" y="430" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20" font-weight="600" fill="#B45309" text-anchor="start" letter-spacing="0">•</text><text x="898" y="430" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="400" fill="#1A1A1A" text-anchor="start" letter-spacing="0">One point could not be verified — marked UNVERIFIED.</text><rect x="848" y="524" width="680" height="284" rx="10" fill="#FFFFFF" stroke="#D8D4CE" stroke-width="1.5"/><text x="876" y="572" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="24" font-weight="650" fill="#1A1A1A" text-anchor="start" letter-spacing="0">Click any sentence</text><text x="876" y="616" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="400" fill="#6B7280" text-anchor="start" letter-spacing="0">See its quotes, the papers they came from,</text><text x="876" y="648" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="400" fill="#6B7280" text-anchor="start" letter-spacing="0">and which checks the sentence passed.</text><text x="876" y="680" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="400" fill="#6B7280" text-anchor="start" letter-spacing="0"></text><text x="876" y="712" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="400" fill="#1A1A1A" text-anchor="start" letter-spacing="0">Nothing in the report is unsourced, and</text><text x="876" y="744" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="400" fill="#1A1A1A" text-anchor="start" letter-spacing="0">nothing is sourced to a paraphrase.</text></svg>
