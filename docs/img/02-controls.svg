<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="The control surface: model judgement and the code checks that bound it"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6B7280"/></marker></defs><rect x="0" y="0" width="1600" height="900" rx="0" fill="#FBFAF8" stroke="#FBFAF8" stroke-width="0"/><text x="72" y="92" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="46" font-weight="650" fill="#1A1A1A" text-anchor="start" letter-spacing="0">Why you can trust it</text><text x="72" y="134" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="22" font-weight="400" fill="#6B7280" text-anchor="start" letter-spacing="0">The model proposes. Code checks every output before anything downstream is allowed to use it.</text><line x1="72" y1="162" x2="1528" y2="162" stroke="#D8D4CE" stroke-width="2"/><text x="96" y="212" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="17" font-weight="600" fill="#1D4ED8" text-anchor="start" letter-spacing="0.5">WHERE THE MODEL DECIDES</text><text x="816" y="212" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="17" font-weight="600" fill="#15803D" text-anchor="start" letter-spacing="0.5">WHAT CODE REQUIRES BEFORE IT COUNTS</text><rect x="72" y="240" width="700" height="98" rx="10" fill="#FFFFFF" stroke="#D8D4CE" stroke-width="1.5"/><text x="96" y="278" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="22" font-weight="600" fill="#1D4ED8" text-anchor="start" letter-spacing="0">plan</text><text x="96" y="310" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#1A1A1A" text-anchor="start" letter-spacing="0">the scope, the sub-questions, the queries</text><rect x="816" y="240" width="712" height="98" rx="10" fill="#FFFFFF" stroke="#D8D4CE" stroke-width="1.5"/><text x="840" y="280" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#1A1A1A" text-anchor="start" letter-spacing="0">three or more usable sub-questions; the user</text><text x="840" y="304" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#1A1A1A" text-anchor="start" letter-spacing="0">approves the scope before anything runs</text><line x1="780" y1="289.0" x2="810" y2="289.0" stroke="#15803D" stroke-width="2" marker-end="url(#a)"/><rect x="72" y="350" width="700" height="98" rx="10" fill="#FFFFFF" stroke="#D8D4CE" stroke-width="1.5"/><text x="96" y="388" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="22" font-weight="600" fill="#1D4ED8" text-anchor="start" letter-spacing="0">screen</text><text x="96" y="420" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#1A1A1A" text-anchor="start" letter-spacing="0">is this paper relevant, and what kind of</text><text x="96" y="444" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#1A1A1A" text-anchor="start" letter-spacing="0">evidence is it</text><rect x="816" y="350" width="712" height="98" rx="10" fill="#FFFFFF" stroke="#D8D4CE" stroke-width="1.5"/><text x="840" y="390" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#1A1A1A" text-anchor="start" letter-spacing="0">retracted papers rejected; no abstract means no</text><text x="840" y="414" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#1A1A1A" text-anchor="start" letter-spacing="0">judgement, not a guess</text><line x1="780" y1="399.0" x2="810" y2="399.0" stroke="#15803D" stroke-width="2" marker-end="url(#a)"/><rect x="72" y="460" width="700" height="98" rx="10" fill="#FFFFFF" stroke="#D8D4CE" stroke-width="1.5"/><text x="96" y="498" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="22" font-weight="600" fill="#1D4ED8" text-anchor="start" letter-spacing="0">extract</text><text x="96" y="530" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#1A1A1A" text-anchor="start" letter-spacing="0">which sentence supports a claim, and what it</text><text x="96" y="554" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#1A1A1A" text-anchor="start" letter-spacing="0">says</text><rect x="816" y="460" width="712" height="98" rx="10" fill="#FFFFFF" stroke="#D8D4CE" stroke-width="1.5"/><text x="840" y="500" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#1A1A1A" text-anchor="start" letter-spacing="0">the quote must appear in the stored source,</text><text x="840" y="524" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#1A1A1A" text-anchor="start" letter-spacing="0">verbatim; the claim may add no name and no number</text><text x="840" y="548" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#1A1A1A" text-anchor="start" letter-spacing="0">the quote lacks</text><line x1="780" y1="509.0" x2="810" y2="509.0" stroke="#15803D" stroke-width="2" marker-end="url(#a)"/><rect x="72" y="570" width="700" height="98" rx="10" fill="#FFFFFF" stroke="#D8D4CE" stroke-width="1.5"/><text x="96" y="608" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="22" font-weight="600" fill="#1D4ED8" text-anchor="start" letter-spacing="0">synthesize</text><text x="96" y="640" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#1A1A1A" text-anchor="start" letter-spacing="0">the points, and which evidence each rests on</text><rect x="816" y="570" width="712" height="98" rx="10" fill="#FFFFFF" stroke="#D8D4CE" stroke-width="1.5"/><text x="840" y="610" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#1A1A1A" text-anchor="start" letter-spacing="0">every number must appear in a cited quote; relayed</text><text x="840" y="634" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#1A1A1A" text-anchor="start" letter-spacing="0">findings must say so; two papers from one lab are</text><text x="840" y="658" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#1A1A1A" text-anchor="start" letter-spacing="0">not two studies</text><line x1="780" y1="619.0" x2="810" y2="619.0" stroke="#15803D" stroke-width="2" marker-end="url(#a)"/><rect x="72" y="680" width="700" height="98" rx="10" fill="#FFFFFF" stroke="#D8D4CE" stroke-width="1.5"/><text x="96" y="718" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="22" font-weight="600" fill="#1D4ED8" text-anchor="start" letter-spacing="0">revise</text><text x="96" y="750" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#1A1A1A" text-anchor="start" letter-spacing="0">a rewrite, or drop the point</text><rect x="816" y="680" width="712" height="98" rx="10" fill="#FFFFFF" stroke="#D8D4CE" stroke-width="1.5"/><text x="840" y="720" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#1A1A1A" text-anchor="start" letter-spacing="0">re-checked, at most twice — then the point renders</text><text x="840" y="744" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#1A1A1A" text-anchor="start" letter-spacing="0">UNVERIFIED in the report</text><line x1="780" y1="729.0" x2="810" y2="729.0" stroke="#15803D" stroke-width="2" marker-end="url(#a)"/><text x="72" y="834" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20" font-weight="500" fill="#1A1A1A" text-anchor="start" letter-spacing="0">No model grades another model's work. Every rule above is code, and every rule exists because of a failure we saw in a real run.</text></svg>
